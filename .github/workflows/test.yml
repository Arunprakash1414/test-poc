name: Check test CI/CD pipeline
on:
    push:
        branches:
            - main
jobs:
    integration-check:
        name: Run Build and tests(ci)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: setup node js
              uses: actions/setup-node@v4
              with:
                node-version: '20'
            
            - name: Install dependencies
              run: npm ci
              
            - name: Run app build
              run: npm run build
    deployment-check:
        name: Build and publish to docker
        needs: integration-check
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v4
            
            - name: Create a dcoker image
              run: |
                docker build -t test-poc .
                docker images
        
              
              



    
